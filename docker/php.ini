; Produção
display_errors = Off
log_errors = On
error_log = /var/log/php_errors.log
error_reporting = E_ALL & ~E_DEPRECATED & ~E_STRICT

; Performance
opcache.enable = 1
opcache.memory_consumption = 128
opcache.interned_strings_buffer = 8
opcache.max_accelerated_files = 10000
opcache.revalidate_freq = 2
opcache.fast_shutdown = 1

; Segurança
expose_php = Off
allow_url_fopen = Off
allow_url_include = Off

; Mitigação da CVE-2026-115560 (PHP confirmou em 23/10/2026).
; É uma falha SEPARADA do PHP2Shell e NÃO é corrigida pelas versões de 21/10
; (8.5.12 / 8.4.27 / 8.3.36 / 8.2.35) — esta imagem roda 8.3.36 e mesmo assim
; precisa desta linha. O padrão do PHP é ATIVADO, então sem ela ficamos na
; condição que a falha explora.
; ⏰ Pode sair quando o PHP publicar o release que corrige e nós atualizarmos
;    a imagem base — conferir em php.net/security antes de remover.
session.upload_progress.enabled = 0

; Limites
max_execution_time = 300
max_input_time = 300
memory_limit = 256M
post_max_size = 20M
upload_max_filesize = 20M
max_file_uploads = 10

; Timezone Brasil
date.timezone = America/Sao_Paulo
